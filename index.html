<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101714">
<title>Menja i Mut Gestionale</title><script src="config.js?v=2"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#101714;--panel:#19221d;--panel2:#202c25;--line:#34443a;--gold:#d7b568;--cream:#f4edda;--muted:#a8b1a8;--green:#6f9676;--red:#bd665c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#131b17;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 17px;border-bottom:1px solid var(--line)}.brand img{width:55px;height:55px;object-fit:cover;border-radius:50%;border:1px solid var(--gold)}.brand b{display:block;letter-spacing:.13em;font-size:13px}.brand small{color:var(--gold);letter-spacing:.12em}.nav{display:grid;gap:4px;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:9px;padding:11px 12px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--cream)}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.nav-label{color:#78847a;font-size:10px;letter-spacing:.15em;padding:12px 12px 4px}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:#101714ee;backdrop-filter:blur(10px);z-index:2}.top small{color:var(--muted)}.content{max-width:1400px;margin:auto;padding:30px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.head h1{font-size:28px;margin:0 0 5px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--cream);padding:10px 14px;border-radius:9px}.btn.gold{background:var(--gold);color:#1d1a11;border-color:var(--gold);font-weight:700}.btn:hover{filter:brightness(1.1)}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:19px}.card small{color:var(--muted)}.metric{font-size:28px;font-weight:700;margin:9px 0 2px}.notice{border:1px solid #695b37;background:#29251a;color:#ead9a8;border-radius:11px;padding:14px 16px;margin-bottom:18px}.two{grid-template-columns:1.25fr 1fr}.box h2{font-size:17px;margin:0 0 16px}.empty{color:var(--muted);text-align:center;padding:35px 12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted);font-weight:500}.badge{display:inline-block;border:1px solid #6d6041;color:#e5d49d;border-radius:20px;padding:3px 9px;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar input{max-width:320px}.field,select,textarea{width:100%;background:#111915;border:1px solid var(--line);color:var(--cream);padding:10px 12px;border-radius:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:13px;color:var(--muted);display:grid;gap:6px}.formgrid .wide{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:5}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.dialog h2{margin:0 0 18px}.dialogfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.actions{display:flex;gap:7px}.smallbtn{background:none;color:var(--gold);border:0;padding:4px}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.producttile{padding:12px;border:1px solid var(--line);border-radius:9px;background:#141c18}.bottomnav{display:none}
@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.content{padding:22px}}
@media(max-width:700px){.app{display:block}.side{display:none}.top{padding:0 17px;height:58px}.content{padding:20px 15px 90px}.head h1{font-size:24px}.cards{gap:10px}.card{padding:14px}.metric{font-size:24px}.two{grid-template-columns:1fr}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#131b17;border-top:1px solid var(--line);overflow:auto;z-index:3}.bottomnav button{min-width:78px;flex:1;background:transparent;border:0;color:var(--muted);padding:9px 5px;font-size:11px}.bottomnav button.active{color:var(--gold)}.bottomnav span{display:block;font-size:17px}.head{align-items:center}.head .btn{padding:9px;font-size:13px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><img src="menjaimut.jpg" alt="Logo Menja i Mut"><div><b>MENJA I MUT</b><small>PIZZA LAB</small></div></div><div class="nav" id="nav"></div><div class="sidefoot" id="sessionInfo">Gestionale online</div></aside><main class="main"><header class="top"><div><b>MENJA I MUT</b> <small>GESTIONALE</small></div><div class="actions"><button class="btn" onclick="importBackup()">Importa backup</button><button class="btn" onclick="exportData()">Esporta dati</button><button class="btn" id="signoutButton" onclick="signOut()" hidden>Esci</button></div></header><section class="content" id="view"></section></main></div><nav class="bottomnav" id="bottom"></nav><div id="modal"></div>
<script>
const sections=[['OPERATIVITÀ',['Dashboard','Ordini','Prenotazioni','Clienti']],['CATALOGO',['Prodotti e ricette','Ricette','Listini']],['PRODUZIONE',['Produzione','Lotti produzione','Magazzino']],['CLIENTI',['Fidelity','CRM']],['AMMINISTRAZIONE',['Finanza','Fatture','Statistiche','Impostazioni']]];
const icons={'Dashboard':'▦','Ordini':'▤','Prenotazioni':'▣','Clienti':'♙','Prodotti e ricette':'◉','Ricette':'◉','Listini':'€','Produzione':'⚙','Lotti produzione':'▧','Magazzino':'▣','Fidelity':'✧','CRM':'♡','Finanza':'◈','Fatture':'▤','Statistiche':'⌁','Impostazioni':'⚙'};
const initial={customers:[],orders:[],products:[],priceLists:[],recipes:[],production:[],fidelity:[],lots:[],inventory:[],invoices:[],events:[]};let db;try{db={...initial,...JSON.parse(localStorage.getItem('menjaimut-v02')||'{}')}}catch{db=structuredClone(initial)};let page='Dashboard';
function save(){if(!onlineClient)localStorage.setItem('menjaimut-v02',JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navigate(p){page=p;render()}function baseNavHTML(){let h='';for(const [title,items] of sections)h+=`<div class="nav-label">${title}</div>`+items.map(x=>`<button class="${page===x?'active':''}" onclick="navigate('${x}')">${icons[x]} &nbsp; ${x}</button>`).join('');document.getElementById('nav').innerHTML=h;let mobile=window.activeProfile?.role==='admin'?['Dashboard','Ordini','Clienti','Prodotti e ricette','Produzione','Magazzino','Fidelity']:['Dashboard','Ordini','Prodotti e ricette','Listini'];document.getElementById('bottom').innerHTML=mobile.map(x=>`<button class="${page===x?'active':''}" onclick="navigate('${x}')"><span>${icons[x]}</span>${x.replace(' e ricette','')}</button>`).join('')}
function head(title,sub,action=''){return `<div class="head"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}function btn(text,fn='openNew()'){return `<button class="btn gold" onclick="${fn}">＋ ${text}</button>`}
function dashboard(){return `${head('Dashboard','Panoramica operativa del laboratorio',btn('Nuovo'))}<div class="notice">Questa è una versione dimostrativa: inserisci i tuoi dati reali. Nessun prezzo, dosaggio o dato di produzione è stato precompilato.</div><div class="grid cards">${[['Clienti registrati',db.customers.length,'Tutte le categorie'],['Ordini in attesa',db.orders.filter(x=>x.status==='Da approvare').length,'Da approvare manualmente'],['Lotti registrati',db.lots.length,'Tracciabilità produzione'],['Prodotti',db.products.length,'Ricette da configurare']].map(x=>`<div class="card"><small>${x[0]}</small><div class="metric">${x[1]}</div><small>${x[2]}</small></div>`).join('')}</div><div class="grid two"><div class="box"><h2>Ultimi ordini</h2>${db.orders.length?table(['Numero','Cliente','Ritiro','Stato'],db.orders.slice(-5).reverse().map(o=>[o.code,o.customer,o.pickup,`<span class="badge">${o.status}</span>`])):`<div class="empty">Nessun ordine ancora registrato</div>`}<button class="smallbtn" onclick="navigate('Ordini')">Apri ordini →</button></div><div class="box"><h2>Ultimi lotti</h2>${db.lots.length?table(['Codice','Prodotto','Data'],db.lots.slice(-5).reverse().map(o=>[o.code,o.product,o.date])):`<div class="empty">Nessun lotto prodotto</div>`}<button class="smallbtn" onclick="navigate('Lotti produzione')">Apri lotti →</button></div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function baseModulePage(){let p=page;let cfg={
'Ordini':['Richieste cliente con approvazione sempre manuale, senza minimo d’ordine',['Numero','Cliente','Data ritiro','Totale','Stato'],db.orders,o=>[o.code,esc(o.customer),esc(o.pickup),o.total?`€ ${esc(o.total)}`:'Da definire',`<span class="badge">${esc(o.status)}</span>${window.activeProfile?.role==='admin'&&o.status==='Da approvare'?` <button class="smallbtn" onclick="setOrderStatus('${o.id}','Confermato')">Approva</button><button class="smallbtn" onclick="setOrderStatus('${o.id}','Rifiutato')">Rifiuta</button>`:''}`],'Nuovo ordine'],
'Prenotazioni':['Calendario dei ritiri presso il laboratorio',['Data','Cliente','Ordine','Stato'],db.orders,o=>[esc(o.pickup),esc(o.customer),o.code,`<span class="badge">${esc(o.status)}</span>`],'Nuova prenotazione'],'Clienti':['Anagrafica clienti e codice fidelity',['Codice','Cliente','Categoria','Email','Telefono','Fidelity','Punti','Stato','Abilitazione'],db.customers,c=>[esc(c.code||'—'),esc(c.name),esc(c.category),esc(c.email),esc(c.phone),esc(c.fidelity_code||c.code||'—'),Number(c.points??c.fidelity_points)||0,`<span class="badge">${esc(c.status||'In attesa')}</span>`,c.isProfile&&window.activeProfile?.role==='admin'?`<button class="smallbtn" onclick="approveProfile('${c.id}','${c.approval_status==='approved'?'Sospeso':'Attivo'}')">${c.approval_status==='approved'?'Sospendi':'Approva'}</button>`:''],'Nuovo cliente'],
'Prodotti e ricette':['Catalogo prodotti: ogni prodotto ha una ricetta separata',['Prodotto','Categoria','Prezzo'],db.products,c=>[esc(c.name),esc(c.category),c.price?`€ ${esc(c.price)}`:'Da configurare'],'Nuovo prodotto'],
'Ricette':['Ricette strutturate e distinte per prodotto',['Ricetta','Prodotto','Ingredienti e dosaggi'],db.recipes,r=>[esc(r.name),esc(r.product),esc(r.ingredients)],'Nuova ricetta'],
'Listini':['Prezzi per categoria o cliente, da configurare senza minimi d’ordine',['Cliente o categoria','Prodotto','Prezzo'],db.priceLists,c=>[esc(c.customer||c.category),esc(c.product),`€ ${esc(c.price)}`],'Nuovo prezzo'],
'Produzione':['Programmazione della produzione dagli ordini confermati',['Prodotto','Quantità','Data','Stato'],db.production ,x=>[esc(x.product),esc(x.qty),esc(x.date),esc(x.status)],'Pianifica produzione'],
'Lotti produzione':['Tracciabilità di prodotto e lotto',['Codice lotto','Prodotto','Quantità','Data produzione','Scadenza'],db.lots,l=>[esc(l.code),esc(l.product),esc(l.qty),esc(l.date),esc(l.expiry)],'Registra lotto'],
'Magazzino':['Scorte, carichi e scarichi · soglie configurabili',['Articolo','Disponibilità','Scorta minima','Unità'],db.inventory,x=>[esc(x.name),esc(x.qty),esc(x.minimum),esc(x.unit)],'Aggiungi articolo'],'Fidelity':['Tessere fidelity e movimenti punti',['Codice fidelity','Cliente','Data','Punti','Nota'],db.fidelity,f=>[esc(f.code||f.card||'—'),esc(f.customer),esc(f.date),esc(f.points),esc(f.note)],'Registra movimento'],
'CRM':['Storico ordini e relazione clienti',['Cliente','Categoria','Ultimo ordine','Ordini totali'],db.customers,c=>[esc(c.name),esc(c.category),'—',db.orders.filter(o=>o.customer===c.name).length],'Aggiungi nota'],
'Finanza':['Incassi, costi e margini · dati da inserire',['Voce','Importo','Data','Stato'],db.events,e=>[esc(e.name),e.amount?`€ ${esc(e.amount)}`:'Da inserire',esc(e.date),esc(e.status)],'Registra movimento'],
'Fatture':['Documenti e scadenze da gestire',['Numero','Cliente','Importo','Scadenza','Stato'],db.invoices,i=>[esc(i.code),esc(i.customer),i.amount?`€ ${esc(i.amount)}`:'Da inserire',esc(i.due),esc(i.status)],'Registra fattura'],
'Statistiche':['Report ed esportazione dei dati inseriti',['Indicatore','Valore'],[{name:'Clienti',val:db.customers.length},{name:'Ordini',val:db.orders.length},{name:'Prodotti',val:db.products.length},{name:'Lotti',val:db.lots.length}],x=>[x.name,x.val],'Esporta report'],
'Impostazioni':['Regole di accesso e configurazione locale',['Impostazione','Valore'],[{name:'Registrazione clienti',val:'Libera con verifica email'},{name:'Abilitazione account',val:'Approvazione amministratore'},{name:'Approvazione ordini',val:'Sempre manuale'},{name:'Ritiro',val:'Solo laboratorio'},{name:'Categorie clienti',val:'Privati · Pizzerie · Hotel · Ristoranti · Negozi e rivenditori · Altre attività'}],x=>[x.name,x.val],'Esporta dati']};let c=cfg[p];let rows=c[2].map(c[3]);return `${head(p,c[0],btn(c[4],`openNew('${p}')`))}<div class="box"><div class="toolbar"><input class="field" placeholder="Cerca" oninput="filterRows(this)"><span class="muted">${c[2].length} elementi</span></div>${c[2].length?table(c[1],rows):`<div class="empty">Nessun elemento ancora registrato</div>`}</div>`}function render(){navHTML();document.getElementById('view').innerHTML=page==='Dashboard'?dashboard():modulePage();if(window.activeProfile?.role==='customer'&&window.activeProfile.approval_status==='approved'){let c=window.activeProfile.customer_code||'—';let b=document.createElement('div');b.className='notice';b.innerHTML=`Codice cliente: <b>${esc(c)}</b> · Fidelity: <b>${esc(c)}</b> · Punti: ${Number(window.activeProfile.fidelity_points)||0}`;document.getElementById('view').prepend(b)}}
function openNew(which=page){if(which==='Esporta report'){exportData();return}let schema={
'Clienti':[['name','Nome o ragione sociale','text',true],['category','Categoria','select',true,['Privati','Pizzerie','Hotel','Ristoranti','Negozi e rivenditori','Altre attività']],['email','Email','email'],['phone','Telefono','tel'],['status','Stato account','select',false,['In attesa di abilitazione','Attivo','Sospeso','Rifiutato']]],
'Prodotti e ricette':[['name','Nome prodotto','text',true],['category','Categoria prodotto','text'],['price','Prezzo unitario (€)','number']],
'Ricette':[['name','Nome ricetta','text',true],['product','Prodotto','text',true],['ingredients','Ingredienti e dosaggi','textarea',true]],
'Listini':[['customer','Cliente (facoltativo)','text'],['category','Categoria cliente','select',false,['Privati','Pizzerie','Hotel','Ristoranti','Negozi e rivenditori','Altre attività']],['product','Prodotto','text',true],['price','Prezzo unitario (€)','number',true]],
'Ordini':[['customer','Cliente','text',true],['pickup','Data e ora ritiro in laboratorio','datetime-local',true],['total','Totale (€)','number'],['status','Stato','select',true,['Da approvare','Confermato','In produzione','Pronto per il ritiro','Ritirato','Rifiutato']],['items','Prodotti e quantità','textarea']],
'Prenotazioni':[['customer','Cliente','text',true],['pickup','Data e ora ritiro','datetime-local',true]],
'Lotti produzione':[['code','Codice lotto','text',true],['product','Prodotto','text',true],['qty','Quantità','number'],['date','Data produzione','date'],['expiry','Scadenza','date']],
'Magazzino':[['name','Articolo / materia prima','text',true],['qty','Disponibilità','number'],['minimum','Scorta minima','number'],['unit','Unità di misura','text']],
'Fatture':[['code','Numero documento','text',true],['customer','Cliente','text'],['amount','Importo (€)','number'],['due','Scadenza','date'],['status','Stato','select',false,['Da pagare','Pagata','Scaduta']]],
'Finanza':[['name','Voce','text',true],['amount','Importo (€)','number'],['date','Data','date'],['status','Stato','text']],
'Produzione':[['product','Prodotto','text',true],['qty','Quantità','number'],['date','Data','date'],['status','Stato','text']],
'Fidelity':[['customer','Cliente','text',true],['date','Data','date',true],['points','Punti (+/-)','number',true],['note','Nota / premio','text']]
};let fields=schema[which]||schema[page]||[['name','Descrizione','text',true],['date','Data','date']];document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><form class="dialog" onsubmit="addRow(event,'${which}')"><h2>${which}</h2><div class="formgrid">${fields.map(([key,label,type,req,opts])=>`<label class="${type==='textarea'?'wide':''}">${label}${type==='select'?`<select name="${key}" ${req?'required':''}>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:type==='textarea'?`<textarea class="field" name="${key}" rows="3"></textarea>`:`<input class="field" type="${type}" name="${key}" ${req?'required':''}>`}</label>`).join('')}</div><div class="dialogfoot"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn gold">Salva</button></div></form></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}async function addRow(e,which){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(which==='Clienti'){try{let code;if(onlineClient){const{data,error}=await onlineClient.rpc('allocate_customer_code');if(error)throw error;code=data}else{let nums=db.customers.map(c=>parseInt(String(c.code||'').replace(/\D/g,''))||0);code='C'+String(Math.max(0,...nums)+1).padStart(3,'0')}obj.code=code;obj.fidelity_code=code;obj.points=0}catch(err){showError(err);return}}if(which==='Ordini'||which==='Prenotazioni')obj.code='ORD-'+String(Date.now()).slice(-6);let bucket={'Clienti':'customers','Prodotti e ricette':'products','Ricette':'recipes','Listini':'priceLists','Ordini':'orders','Prenotazioni':'orders','Lotti produzione':'lots','Magazzino':'inventory','Fidelity':'fidelity','Produzione':'production','Fatture':'invoices','Finanza':'events','CRM':'events'}[which]||'events';if(which==='Clienti')obj.status=obj.status||'In attesa di abilitazione';if(which==='Ordini')obj.status=obj.status||'Da approvare';if(which==='Ordini'&&window.activeProfile?.role!=='admin')obj.customer=window.activeProfile.full_name||window.activeProfile.email;obj.id=crypto.randomUUID();db[bucket].push(obj);save();if(onlineClient)persistRecord(bucket,obj).catch(showError);closeModal();render()}
function filterRows(inp){let q=inp.value.toLowerCase();document.querySelectorAll('.table tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function exportData(){let blob=new Blob([JSON.stringify({format:'menja-i-mut-backup-v1',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menja-i-mut-backup.json';a.click();URL.revokeObjectURL(a.href)}
</script><script src="app-online.js?v=3"></script></body></html>
