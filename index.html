/* MENJA I MUT · interfaccia premium riservata al proprietario */
body.admin-mode{--bg:#0c1110;--panel:#171f1c;--panel2:#202b26;--line:#34443b;--gold:#d9b66d;--cream:#f5f0e5;--muted:#a5afa7;background:radial-gradient(ellipse at 80% 0%,#24352b 0,transparent 34%),var(--bg)}
body.admin-mode .app{grid-template-columns:270px minmax(0,1fr)}
body.admin-mode .side{background:linear-gradient(180deg,#151e19,#101613);border-right:1px solid #39483e;padding:25px 16px;gap:22px;box-shadow:12px 0 35px #0002}

body.admin-mode .nav{gap:5px}

body.admin-mode .nav button{position:relative;border:1px solid transparent;border-radius:10px;padding:11px 13px;color:#b2bdb4;transition:background .18s,border-color .18s,transform .18s}
body.admin-mode .nav button:hover{background:#ffffff09;border-color:#ffffff12;color:#fff;transform:translateX(2px)}
body.admin-mode .nav button.active{background:linear-gradient(100deg,#d9b66d20,#d9b66d08);border-color:#d9b66d40;color:#f5e5bd;box-shadow:inset 3px 0 var(--gold),0 5px 18px #0002}
body.admin-mode .sidefoot{border-top:1px solid #344239;padding:15px 10px 5px;color:#aeb8af;line-height:1.7}
body.admin-mode .top{height:74px;padding:0 clamp(18px,3vw,42px);background:#111915ef;border-bottom:1px solid #34443a;box-shadow:0 7px 24px #0002}
body.admin-mode .top>div:first-child b{letter-spacing:.17em;color:#fff7e7}
body.admin-mode .top>div:first-child small{color:var(--gold);letter-spacing:.13em}
body.admin-mode .content{max-width:1540px;padding:clamp(22px,3vw,42px)}
body.admin-mode .head{align-items:center;margin-bottom:27px}
body.admin-mode .head h1{font-size:clamp(25px,2.2vw,32px);letter-spacing:-.035em;color:#fff8e9}
body.admin-mode .head .muted{font-size:13px;color:#aab5ac}
body.admin-mode .btn{border-color:#435247;background:linear-gradient(180deg,#26332c,#1d2822);border-radius:10px;padding:10px 15px;box-shadow:0 3px 10px #0002;transition:transform .18s,filter .18s,border-color .18s}
body.admin-mode .btn:hover{filter:brightness(1.16);transform:translateY(-1px);border-color:#b89a5d}
body.admin-mode .btn.gold{background:linear-gradient(135deg,#e3c783,#cba65b);color:#211b10;border-color:#e0c17c;box-shadow:0 5px 16px #caa85b25;font-weight:750}
body.admin-mode .card,body.admin-mode .box{background:linear-gradient(145deg,#1b2620,#151d19 78%);border:1px solid #35463b;border-radius:15px;box-shadow:0 10px 28px #00000020}
body.admin-mode .card{position:relative;overflow:hidden;padding:21px}
body.admin-mode .card:after{content:"";position:absolute;width:100px;height:100px;right:-48px;top:-50px;border:1px solid #d9b66d24;border-radius:50%;box-shadow:0 0 0 12px #d9b66d08,0 0 0 25px #d9b66d05;pointer-events:none}
body.admin-mode .card small{color:#aeb9af;font-size:12px}
body.admin-mode .metric{font-size:31px;letter-spacing:-.04em;color:#f4dfad;margin:12px 0 4px}
body.admin-mode .box{padding:22px}

body.admin-mode .notice{border-color:#8b7445;background:linear-gradient(110deg,#3a301d,#28251b);color:#f1dfb4;border-radius:12px;box-shadow:inset 3px 0 #d9b66d}

body.admin-mode .table th{background:#202b25;color:#d1bd8d;text-transform:uppercase;letter-spacing:.09em;font-size:10px;font-weight:700;padding:14px 13px}
body.admin-mode .table td{padding:13px;border-bottom:1px solid #2d3a32;color:#e7e4d9}

body.admin-mode .badge{background:#d9b66d12;border-color:#b99b5c80;color:#efd99f;padding:4px 10px;font-weight:600}
body.admin-mode .toolbar{gap:13px;margin-bottom:17px}
body.admin-mode .toolbar .field{max-width:360px}
body.admin-mode .field,body.admin-mode select,body.admin-mode textarea{background:#101713;border-color:#3b4b40;border-radius:9px;color:#f3eddf;outline:none;transition:border-color .15s,box-shadow .15s}
body.admin-mode .field:focus,body.admin-mode select:focus,body.admin-mode textarea:focus{border-color:#c7a65f;box-shadow:0 0 0 3px #d9b66d18}
body.admin-mode .formgrid label{color:#c4cbbf;font-weight:550;gap:8px}
body.admin-mode .empty{padding:42px 14px;color:#aab5ac}
body.admin-mode .smallbtn{font-weight:650}
body.admin-mode .dialog{background:linear-gradient(145deg,#1c2821,#141c18);border-color:#59684f;border-radius:17px;box-shadow:0 25px 80px #0009}
body.admin-mode .dialog h2{color:#f7e9c7;font-size:21px}
body.admin-mode .dialogfoot{padding-top:14px;border-top:1px solid #34443a}
body.admin-mode .producttile{background:#121a15;border-color:#39483e;border-radius:11px}
body.admin-mode .bottomnav{background:#121a15;border-top-color:#39483e}
body.admin-mode .bottomnav button.active{color:#e4c47c}
@media(max-width:1000px){body.admin-mode .app{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:700px){body.admin-mode .app{display:block}body.admin-mode .content{padding:22px 15px 96px}body.admin-mode .top{height:62px;padding:0 14px}body.admin-mode .top .btn{padding:8px 9px;font-size:12px}body.admin-mode .head{gap:10px;margin-bottom:20px}body.admin-mode .head h1{font-size:24px}body.admin-mode .cards{gap:10px}body.admin-mode .card{padding:15px}body.admin-mode .metric{font-size:25px}body.admin-mode .box{padding:16px}body.admin-mode .toolbar{align-items:stretch;flex-wrap:wrap}body.admin-mode .toolbar .field{max-width:none;flex:1 1 100%}body.admin-mode .bottomnav button{padding:10px 4px}}

.order-nav-dot{display:inline-block;width:9px;height:9px;margin-left:9px;vertical-align:middle;border-radius:50%;background:#f04444;box-shadow:0 0 0 3px #f0444430;animation:orderDotPulse 1.6s ease-in-out infinite}

.owner-order-notice[hidden]{display:none}

.owner-order-notice small{display:block;margin-top:4px;color:#ffd9dc;font-size:13px}
.order-notice-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.owner-order-notice button{border:1px solid #ffb6bb;border-radius:8px;background:#f04444;color:white;padding:9px 13px;font-weight:800;white-space:nowrap}
.owner-order-notice .order-notice-enable{background:transparent;color:#fff}
.owner-order-notice .order-notice-close{background:transparent;border:0;font-size:20px;padding:4px 8px}
@media(max-width:700px){.owner-order-notice{align-items:stretch;flex-direction:column;margin:10px 12px 0;padding:14px}.order-notice-actions{align-items:stretch}.owner-order-notice button{width:100%}}
